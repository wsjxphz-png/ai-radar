name: AI 雷达日报

on:
  schedule:
    # 北京时间 15:00 = UTC 07:00
    # GitHub Actions cron 使用 UTC 时间
    - cron: '0 7 * * *'
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: write

jobs:
  daily-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 生成日报
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          TWITTER_COOKIES: ${{ secrets.TWITTER_COOKIES }}
        run: python main.py

      - name: 失败通知（如果日报生成失败）
        if: failure()
        run: |
          echo "日报生成失败，请检查 GitHub Actions 日志。"

      # 心跳保持：每次运行提交时间戳，保证仓库持续有活动，
      # 防止 GitHub 因 60 天无仓库活动自动禁用 schedule workflow（2026-08-04 曾发生）
      - name: 心跳保持（防 inactivity 禁用）
        if: always()
        run: |
          echo "last_run: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > last_run.txt
          git config user.name "ai-radar-bot"
          git config user.email "ai-radar-bot@users.noreply.github.com"
          git add last_run.txt
          git diff --cached --quiet || git commit -m "chore: heartbeat $(date -u +%Y%m%d-%H%M)"
          git push

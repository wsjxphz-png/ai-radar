name: AI 雷达日报

on:
  schedule:
    # 北京时间 15:00 = UTC 07:00
    # GitHub Actions cron 使用 UTC 时间
    - cron: '0 7 * * *'
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: write

# 同一时间只允许跑一个（2026-09-03 与 opc-digdaily 对齐）：
# 看门狗补推 dispatch 与 schedule 撞车时排队而非并发，避免双写/双推
concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  daily-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 生成日报
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: https://apihub.agnes-ai.com/v1
          AI_MODEL: agnes-2.5-flash
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          TWITTER_COOKIES: ${{ secrets.TWITTER_COOKIES }}
        run: python main.py

      # 推送成功标记：main.py 成功（exit 0 = 推送成功或过滤后无内容）后写北京时间日期，
      # 随心跳步骤提交回仓库。看门狗读它做「今日(北京)已送达」早退。
      # 注（2026-09-03 审查确认）：job 级 kill（超时/cancel）会连本步骤一起终止，
      # 故它防不了 kill 场景——那是看门狗 age 主判定的职责；本标记的价值是与
      # run status 互为冗余的成功信号 + 北京时间日界语义（跨 UTC 午夜不混淆）。
      # 与 opc 的 push_marker 机制对齐。
      - name: 推送成功标记
        if: success()
        run: echo "$(TZ=Asia/Shanghai date +%Y-%m-%d)" > push_marker.json

      - name: 失败通知（如果日报生成失败）
        if: failure()
        run: |
          echo "日报生成失败，请检查 GitHub Actions 日志。"

      # 心跳保持：每次运行提交时间戳，保证仓库持续有活动，
      # 防止 GitHub 因 60 天无仓库活动自动禁用 schedule workflow（2026-08-04 曾发生）
      # push_marker.json 一并提交（失败日 marker 未更新 → 无 diff → 不会误标成功）
      - name: 心跳保持（防 inactivity 禁用）
        if: always()
        run: |
          echo "last_run: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > last_run.txt
          git config user.name "ai-radar-bot"
          git config user.email "ai-radar-bot@users.noreply.github.com"
          git add last_run.txt
          # push_marker.json 首次成功运行前不存在（2026-09-03 审查 F2：无容错时
          # 首个失败日 git add 报 fatal → 心跳静默失效一天）
          if [ -f push_marker.json ]; then git add push_marker.json; fi
          git diff --cached --quiet || git commit -m "chore: heartbeat $(date -u +%Y%m%d-%H%M)"
          git push

name: 雷达看门狗

# 静默自愈：主推送通道被禁用（含 GitHub 60 天无活动自动禁用）或当日推送失败时，
# 在后台默默修好，不在群里发任何通知。用户只会在固定时间收到正常的每日推送。
# 2026-08-14 加装：此前 8/4 起 workflow 被 disabled_inactivity 禁用 10 天无人知晓。
on:
  schedule:
    # 北京时间每天 06:00 = UTC 22:00。
    # 2026-08-29 从 10:30 挪到 22:00：8-26/27 GitHub 平台级 schedule 延迟后，
    # 主推送 run 可能延迟到 UTC 18-21 点才创建，看门狗若在其前检查会误判
    # 「今日无成功」而补推 → 与延迟到达的主推送双推。
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  actions: write   # 重新启用 / 触发主 workflow
  contents: read

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # 读 push_marker.json（主 workflow 推送成功后写入，随心跳提交；2026-09-03 与 opc 对齐）
      - uses: actions/checkout@v4

      - name: 检查并自愈主推送通道
        env:
          WF: daily-report.yml
          REPO: ${{ github.repository }}
          # 2026-08-29 修复：gh CLI 在 Actions 里不自动继承 GITHUB_TOKEN，
          # 此前看门狗自 8-14 上线起每次运行都 exit 4（自愈机制从未生效）
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          STATE=$(gh api "repos/$REPO/actions/workflows/$WF" --jq '.state')
          echo "主推送当前状态: $STATE"

          # 1) 被禁用（手动 / 60 天无活动）-> 自动重开
          if [ "$STATE" = "disabled_manually" ] || [ "$STATE" = "disabled_inactivity" ]; then
            gh workflow enable "$WF" --repo "$REPO" || true
            echo "已自动重新启用"
          fi

          # 2) 快速通道：推送成功标记命中（主 workflow 成功后写北京时间日期并随心跳提交）。
          #    标记比 run status 可靠——run 可能被超时 kill 但推送已成功，只看 status 会误补推。
          #    （2026-09-03 与 opc 的 push_marker 机制对齐；时间基准同为北京时间 CST）
          TODAY_CST=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          MARKER=push_marker.json
          if [ -f "$MARKER" ] && [ "$(cat "$MARKER")" = "$TODAY_CST" ]; then
            echo "今日(北京时间)已有成功推送标记，不补推"
            exit 0
          fi

          # 3) 距上次成功推送 ≥ 一个周期（24h）且无任务在跑 -> 判定通道异常，静默补推一次
          #    ⚠ 2026-09-03 修复：原逻辑按 UTC 日历日判定（最近成功不在「今天」即补推）。
          #    本看门狗 cron 22:00 UTC 距午夜仅 2h 余量，GitHub schedule 常规延迟 2-3h 即
          #    跨 UTC 午夜（run 实际启动 00:13-01:43）→「今天」清零、而当天主推送要到
          #    UTC 12 点后才创建 → 必然误判补推 → 用户一天收两次推送
          #    （8-30~9-03 实测误判：ai-radar 2/5、opc 4/5 次看门狗）。
          #    改为按「距上次成功推送的时间间隔」判定：24h 内已成功即视为本周期已推送，
          #    「看门狗跨天」与「主推送延迟晚到」两个方向的误判同时免疫；
          #    真失败/被禁用（≥24h 无成功）仍会补推。边界（已知取舍）：连续两日主推失败
          #    且前夜补推恰在 UTC 01:00 附近成功时，次日补推可能顺延一个周期（不丢失，
          #    晚约一天送达）；队列卡死 run 会压住补推——宁可不补也不双推。
          LAST_OK_TS=$(gh run list --workflow "$WF" --repo "$REPO" --status success \
                          --limit 1 --json createdAt --jq '.[0].createdAt // ""')
          if [ -n "$LAST_OK_TS" ]; then
            AGE_H=$(( ( $(date -u +%s) - $(date -u -d "$LAST_OK_TS" +%s) ) / 3600 ))
          else
            AGE_H=99999
          fi
          # 任何进行中/排队/等待的 run 都不补推（含跨天前创建仍未跑完的），等它出结果
          PENDING=$(gh run list --workflow "$WF" --repo "$REPO" --limit 10 \
                      --json status \
                      --jq '[.[] | select(.status=="in_progress" or .status=="queued" or .status=="waiting")] | length')
          echo "距上次成功推送: ${LAST_OK_TS:-无}（${AGE_H} 小时前）；进行中/排队: ${PENDING:-0}"

          if [ "${AGE_H}" -ge 24 ] && [ "${PENDING:-0}" = "0" ]; then
            echo "距上次成功推送 ≥24h 且无任务在跑，判定通道异常，静默补推一次"
            gh workflow run "$WF" --repo "$REPO" || true
          fi

          # 静默自愈原则：全程不在群里发任何通知

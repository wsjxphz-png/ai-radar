name: 雷达看门狗

# 静默自愈：主推送通道被禁用（含 GitHub 60 天无活动自动禁用）或当日推送失败时，
# 在后台默默修好，不在群里发任何通知。用户只会在固定时间收到正常的每日推送。
# 2026-08-14 加装：此前 8/4 起 workflow 被 disabled_inactivity 禁用 10 天无人知晓。
on:
  schedule:
    # 北京时间每天 06:00 = UTC 22:00。
    # 2026-08-29 从 10:30 挪到 22:00：8-26/27 GitHub 平台级 schedule 延迟后，
    # 主推送 run 可能延迟到 UTC 18-21 点才创建，看门狗若在其前检查会误判
    # 「今日无成功」而补推 → 与延迟到达的主推送双推。
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  actions: write   # 重新启用 / 触发主 workflow
  contents: read

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 检查并自愈主推送通道
        env:
          WF: daily-report.yml
          REPO: ${{ github.repository }}
          # 2026-08-29 修复：gh CLI 在 Actions 里不自动继承 GITHUB_TOKEN，
          # 此前看门狗自 8-14 上线起每次运行都 exit 4（自愈机制从未生效）
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TODAY=$(date -u +%Y-%m-%d)

          STATE=$(gh api "repos/$REPO/actions/workflows/$WF" --jq '.state')
          echo "主推送当前状态: $STATE"

          # 1) 被禁用（手动 / 60 天无活动）-> 自动重开
          if [ "$STATE" = "disabled_manually" ] || [ "$STATE" = "disabled_inactivity" ]; then
            gh workflow enable "$WF" --repo "$REPO" || true
            echo "已自动重新启用"
          fi

          # 2) 今日尚无成功运行 -> 静默补推一次（排除仍在跑/排队的）
          LAST_OK=$(gh run list --workflow "$WF" --repo "$REPO" --status success \
                      --limit 1 --json createdAt --jq '.[0].createdAt // ""' | cut -c1-10)
          PENDING=$(gh run list --workflow "$WF" --repo "$REPO" --limit 10 \
                      --json createdAt,status \
                      --jq "[.[] | select((.status==\"in_progress\") or (.status==\"queued\") or (.status==\"waiting\")) | select(.createdAt[0:10]==\"$TODAY\")] | length")
          echo "今日(UTC $TODAY) 最近成功: ${LAST_OK:-无}；今日进行中/排队: ${PENDING:-0}"

          if [ "$LAST_OK" != "$TODAY" ] && [ "${PENDING:-0}" = "0" ]; then
            echo "今日尚未成功推送，静默补推一次"
            gh workflow run "$WF" --repo "$REPO" || true
          fi

          # 静默自愈原则：全程不在群里发任何通知
